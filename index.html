<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS GC18 - ระบบใบเบิกออนไลน์</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .status-badge { padding: 4px 12px; border-radius: 99px; font-weight: bold; font-size: 10px; display: inline-block; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-cancel { background: #fee2e2; color: #991b1b; }
        .status-self-cancel { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .history-card { background: white; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-top: 2rem; }
        .history-header { background: #6366f1; color: white; padding: 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
        #pwModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100; }
        /* สไตล์ปุ่ม Tab */
        .tab-btn { padding: 8px 20px; border-radius: 12px; font-weight: bold; font-size: 12px; transition: all 0.2s; border: 2px solid transparent; }
        .tab-btn.active { border-color: white; background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <!-- [1] หน้า Login -->
    <div id="loginPage" class="page active">
        <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 text-center border-t-8 border-indigo-600">
                <div class="mb-8 text-center">
                    <div id="loginLogoContainer" class="inline-flex items-center justify-center p-4 bg-slate-50 rounded-full mb-4 shadow-inner min-w-[120px] min-h-[120px]">
                        <i id="defaultLogo" class="fas fa-warehouse text-5xl text-indigo-700"></i>
                        <img id="customLogo" src="" class="hidden max-w-[100px] max-h-[100px] object-contain">
                    </div>
                    <h2 id="sysTitle" class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Warehouse System</h2>
                </div>
                <form id="loginForm" class="space-y-4">
                    <input type="text" id="logUser" placeholder="Username" required class="w-full px-4 py-3 border rounded-2xl outline-none focus:ring-2 ring-indigo-500 bg-slate-50">
                    <input type="password" id="logPass" placeholder="Password" required class="w-full px-4 py-3 border rounded-2xl outline-none focus:ring-2 ring-indigo-500 bg-slate-50">
                    <button type="submit" class="w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl hover:bg-slate-800 transition shadow-lg uppercase">เข้าสู่ระบบ</button>
                    <p class="mt-6 text-sm text-gray-500">ยังไม่มีบัญชี? <a href="javascript:showPage('regPage')" class="text-indigo-600 font-bold underline">สมัครสมาชิก</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- [2] หน้าพนักงานเบิกของ -->
    <div id="userPage" class="page">
        <nav class="bg-slate-900 text-white p-4 flex justify-between px-8 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg"><i class="fas fa-user text-white"></i></div>
                <div><div class="font-bold leading-tight text-indigo-400" id="userDisp"></div><div class="text-[10px] text-slate-400 uppercase tracking-widest" id="deptDisp"></div></div>
            </div>
            <div class="flex gap-2">
                <button onclick="openUserPwModal()" class="text-[10px] bg-slate-700 px-3 py-1 rounded-full font-bold hover:bg-slate-600 transition border border-slate-500"><i class="fas fa-key mr-1"></i> เปลี่ยนรหัส</button>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-1 rounded-full text-xs font-bold hover:bg-red-600 transition">Logout</button>
            </div>
        </nav>
        <div class="container mx-auto p-6 max-w-5xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border-b-4 border-indigo-600 text-center">
                    <h3 class="font-black text-lg mb-4 text-slate-800 uppercase">Spare Part</h3>
                    <input type="file" id="spareFile" class="text-xs mb-3 block w-full border-2 border-dashed p-3 rounded-xl">
                    <input type="text" id="spareNote" placeholder="รายละเอียด/วันที่ใช้งาน" class="w-full border p-2 mb-4 rounded-xl text-sm outline-none focus:ring-2 ring-indigo-500">
                    <button onclick="handleUpload('Spare Part', 'spareFile', 'spareNote')" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold hover:bg-slate-800 transition shadow-lg">ส่งใบเบิกอะไหล่</button>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border-b-4 border-orange-500 text-center">
                    <h3 class="font-black text-lg mb-4 text-slate-800 uppercase">PPE</h3>
                    <input type="file" id="ppeFile" class="text-xs mb-3 block w-full border-2 border-dashed p-3 rounded-xl">
                    <input type="text" id="ppeNote" placeholder="รายละเอียด/วันที่ใช้งาน" class="w-full border p-2 mb-4 rounded-xl text-sm outline-none focus:ring-2 ring-orange-500">
                    <button onclick="handleUpload('PPE', 'ppeFile', 'ppeNote')" class="w-full bg-orange-500 text-white py-3 rounded-2xl font-bold hover:bg-slate-800 transition shadow-lg">ส่งใบเบิก PPE</button>
                </div>
            </div>
            <div class="history-card">
                <div class="history-header">
                    <div class="flex items-center gap-2"><i class="fas fa-history"></i> <span class="font-bold uppercase">ประวัติของคุณ</span></div>
                </div>
                <div class="overflow-x-auto min-h-[300px]"><table class="w-full text-left"><thead class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold border-b"><tr><th class="p-5">วัน/เวลา</th><th class="p-5">ประเภท</th><th class="p-5">หมายเหตุ</th><th class="p-5">สถานะ</th><th class="p-5">ผู้ดำเนินการ</th><th class="p-5 text-center">จัดการ</th></tr></thead><tbody id="userHistoryBody" class="divide-y text-sm text-slate-600"></tbody></table></div>
            </div>
        </div>
    </div>

    <!-- [3] หน้า Admin / Staff -->
    <div id="adminPage" class="page">
        <nav class="bg-slate-900 text-white p-4 flex justify-between px-8 border-b-4 border-indigo-600 shadow-2xl">
            <div class="flex items-center gap-3">
                <i class="fas fa-user-shield text-indigo-500 text-xl"></i>
                <div>
                    <div class="font-black italic uppercase text-sm" id="adminRoleTitle">Admin Control</div>
                    <div class="text-[10px] text-slate-400" id="adminNameDisp"></div>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="changeAdminPassword()" class="text-[10px] bg-slate-700 px-3 py-2 rounded-full font-bold hover:bg-slate-600 transition border border-slate-500"><i class="fas fa-key mr-1"></i> เปลี่ยนรหัส</button>
                <button onclick="logout()" class="text-xs bg-red-600 px-5 py-2 rounded-full font-bold hover:bg-red-700 transition">Logout</button>
            </div>
        </nav>
        <div class="p-6 space-y-6 max-w-7xl mx-auto">
            <div id="adminOnlyPanel" class="space-y-6">
                <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
                    <h3 class="font-bold mb-6 flex items-center gap-2 text-slate-800"><i class="fas fa-cog text-indigo-600"></i> ตั้งค่าระบบ</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <input type="text" id="setSystemName" placeholder="ชื่อระบบ" class="w-full border p-3 rounded-xl outline-none focus:ring-2 ring-indigo-500">
                        <input type="text" id="setLogoUrl" placeholder="ลิงก์โลโก้" class="w-full border p-3 rounded-xl outline-none focus:ring-2 ring-indigo-500">
                        <button onclick="saveSettings()" class="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold">บันทึก</button>
                    </div>
                </div>
                <div class="bg-white rounded-3xl shadow-xl overflow-hidden border">
                    <div class="p-4 bg-emerald-600 font-bold text-white uppercase text-xs">ข้อมูลสมาชิก</div>
                    <div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="bg-slate-50 border-b font-bold text-slate-500 uppercase"><tr><th class="p-4">รหัสพนักงาน</th><th class="p-4">ชื่อ</th><th class="p-4">หน่วยงาน</th><th class="p-4">TEL</th><th class="p-4">USER</th><th class="p-4">PASS</th><th class="p-4 text-center">ลบ</th></tr></thead><tbody id="adminUserBody" class="divide-y"></tbody></table></div>
                </div>
            </div>
            
            <!-- ส่วนที่ขอให้เพิ่ม: แบ่งแยกรายการใบเบิก -->
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border">
                <div class="p-5 bg-indigo-600 font-bold text-white uppercase text-xs flex flex-wrap justify-between items-center gap-4">
                    <div class="flex items-center gap-2">
                        <button onclick="setAdminTab('รอดำเนินการ')" id="tab-pending" class="tab-btn active">1. รอดำเนินการ</button>
                        <button onclick="setAdminTab('สำเร็จ')" id="tab-success" class="tab-btn">2. เสร็จสิ้น</button>
                        <button onclick="setAdminTab('ยกเลิก')" id="tab-cancel" class="tab-btn">3. ยกเลิก</button>
                    </div>
                    <button id="clearHistoryBtn" onclick="clearAllHistory()" class="bg-red-500 px-3 py-1.5 rounded-lg text-[10px]">ล้างประวัติทั้งหมด</button>
                </div>
                <div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="bg-slate-50 border-b font-bold text-slate-500 uppercase"><tr><th class="p-5">วัน/เวลา</th><th class="p-4">รหัส</th><th class="p-4">ชื่อ</th><th class="p-4">หน่วยงาน</th><th class="p-4">ประเภท</th><th class="p-4">หมายเหตุ</th><th class="p-4">ผู้จัดการ</th><th class="p-4 text-center">สถานะ</th></tr></thead><tbody id="adminReqBody" class="divide-y"></tbody></table></div>
            </div>
        </div>
    </div>

    <!-- [4] หน้าสมัครสมาชิก -->
    <div id="regPage" class="page">
        <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="max-w-lg w-full bg-white rounded-[2rem] p-10 shadow-2xl">
                <h2 class="text-2xl font-black mb-6 border-b-4 border-indigo-600 inline-block pb-2">สมัครสมาชิก</h2>
                <form id="regForm" class="space-y-4 pt-4">
                    <input type="text" id="regEmpID" placeholder="รหัสพนักงาน" required class="w-full border-2 p-3 rounded-xl">
                    <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" required class="w-full border-2 p-3 rounded-xl">
                    <select id="regDept" required class="w-full border-2 p-3 rounded-xl bg-white">
                        <option value="" disabled selected>เลือกหน่วยงาน</option>
                        <option value="PH-MN">PH-MN</option>
                        <option value="PH-MN-MM">PH-MN-MM</option>
                        <option value="PH-MN-ICE">PH-MN-ICE</option>
                        <option value="PH-P2">PH-P2</option>
                        <option value="PH-P1">PH-P1</option>
                        <option value="T-LB-O5">T-LB-O5</option>
                        <option value="TP-TA-WM">TP-TA-WM</option>
                        <option value="MT-S1">MT-S1</option>
                        <option value="QC-L1">QC-L1</option>
                        <option value="PD-M3">PD-M3</option>
                        <option value="WH-S2">WH-S2</option>
                        <option value="ENG-E1">ENG-E1</option>
                        <option value="HR-A2">HR-A2</option>
                        <option value="MT-S2">MT-S2</option>
                        <option value="QC-L2">QC-L2</option>
                        <option value="PD-M4">PD-M4</option>
                        <option value="WH-S3">WH-S3</option>
                        <option value="ENG-E2">ENG-E2</option>
                        <option value="HR-A3">HR-A3</option>
                        <option value="MT-S3">MT-S3</option>
                        <option value="QC-L3">QC-L3</option>
                        <option value="PD-M5">PD-M5</option>
                        <option value="WH-S4">WH-S4</option>
                        <option value="ENG-E3">ENG-E3</option>
                        <option value="IT-S1">IT-S1</option>
                    </select>
                    <input type="tel" id="regTel" placeholder="เบอร์โทรศัพท์ (TEL)" required class="w-full border-2 p-3 rounded-xl">
                    <input type="text" id="regUser" placeholder="Username" required class="w-full border-2 p-3 rounded-xl">
                    <input type="password" id="regPass" placeholder="Password" required class="w-full border-2 p-3 rounded-xl">
                    <div class="flex gap-3 mt-6">
                        <button type="button" onclick="showPage('loginPage')" class="flex-1 bg-slate-100 py-4 rounded-xl font-bold">กลับ</button>
                        <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-bold">ยืนยันสมัคร</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal เปลี่ยนรหัสผ่าน -->
    <div id="pwModal">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4">
            <h3 class="text-xl font-bold mb-4 text-indigo-700">เปลี่ยนรหัสผ่าน</h3>
            <div class="space-y-4">
                <input type="password" id="newPw1" placeholder="รหัสผ่านใหม่" class="w-full border p-3 rounded-xl bg-slate-50">
                <input type="password" id="newPw2" placeholder="ยืนยันรหัสผ่านใหม่" class="w-full border p-3 rounded-xl bg-slate-50">
                <div class="flex gap-2 pt-2">
                    <button onclick="closeUserPwModal()" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold">ยกเลิก</button>
                    <button onclick="updateUserPassword()" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">บันทึก</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5J0CGXQYb2b1IyfICNWnf5eQfNXNeGcw",
            authDomain: "teeorder-11d9d.firebaseapp.com",
            databaseURL: "https://teeorder-11d9d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "teeorder-11d9d",
            storageBucket: "teeorder-11d9d.firebasedatabase.app",
            messagingSenderId: "108104956407",
            appId: "1:108104956407:web:767d5c2ecb8069e24516f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = null;
        let adminUserSession = null;
        let rawRequests = {};
        let rawUsers = {};
        let currentAdminTab = 'รอดำเนินการ'; // เก็บสถานะ Tab ที่เลือก

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // ฟังก์ชันเปลี่ยน Tab
        window.setAdminTab = (status) => {
            currentAdminTab = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(status === 'รอดำเนินการ') document.getElementById('tab-pending').classList.add('active');
            if(status === 'สำเร็จ') document.getElementById('tab-success').classList.add('active');
            if(status === 'ยกเลิก') document.getElementById('tab-cancel').classList.add('active');
            renderAdminTables();
        };

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const u = document.getElementById('logUser').value.trim();
            const p = document.getElementById('logPass').value.trim();

            try {
                const adminSnap = await get(ref(db, 'admins/' + u));
                const adminData = adminSnap.val();
                if (adminData && String(adminData.pass) === String(p)) {
                    adminUserSession = u;
                    const role = adminData.role;
                    document.getElementById('adminOnlyPanel').classList.toggle('hidden', role === 'staff');
                    document.getElementById('clearHistoryBtn').classList.toggle('hidden', role === 'staff');
                    document.getElementById('adminRoleTitle').innerText = role === 'staff' ? 'Staff Control' : 'Admin Control';
                    document.getElementById('adminNameDisp').innerText = adminData.name;
                    return showPage('adminPage');
                }

                const userSnap = await get(ref(db, 'users/' + u));
                const user = userSnap.val();
                if(user && String(user.pass) === String(p)) {
                    currentUser = user;
                    document.getElementById('userDisp').innerText = user.name;
                    document.getElementById('deptDisp').innerText = user.dept;
                    showPage('userPage');
                    startHistoryListener(); 
                } else { alert("Username หรือ Password ไม่ถูกต้อง!"); }
            } catch (err) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อ"); }
        };

        window.changeAdminPassword = () => {
            const newPass = prompt("ระบุรหัสผ่านใหม่สำหรับ " + adminUserSession + ":");
            if (newPass && newPass.trim().length >= 4) {
                update(ref(db, 'admins/' + adminUserSession), { pass: newPass.trim() }).then(() => alert("สำเร็จ"));
            }
        };

        window.handleUpload = (type, fileId, noteId) => {
            const fileInput = document.getElementById(fileId);
            const file = fileInput.files[0];
            if(!file) return alert("เลือกไฟล์ใบเบิก");
            const reader = new FileReader();
            reader.onload = (e) => {
                push(ref(db, 'requisitions'), {
                    user: currentUser.name, empID: currentUser.empID, dept: currentUser.dept,
                    type, note: document.getElementById(noteId).value || "-",
                    fileData: e.target.result, status: "รอดำเนินการ",
                    timestamp: new Date().toLocaleString('th-TH'), managedBy: ""
                }).then(() => { alert("ส่งสำเร็จ!"); fileInput.value = ''; document.getElementById(noteId).value = ''; });
            };
            reader.readAsDataURL(file);
        };

        function startHistoryListener() {
            onValue(ref(db, 'requisitions'), (snap) => {
                const data = snap.val() || {};
                const uHist = document.getElementById('userHistoryBody');
                uHist.innerHTML = '';
                Object.keys(data).reverse().forEach(id => {
                    const r = data[id];
                    if(currentUser && r.user === currentUser.name) {
                        let sClass = r.status === 'สำเร็จ' ? 'status-success' : (r.status === 'ยกเลิก' ? 'status-cancel' : (r.status === 'ยกเลิกเอง' ? 'status-self-cancel' : 'status-pending'));
                        uHist.innerHTML += `<tr><td class="p-5 text-[10px]">${r.timestamp}</td><td class="p-5 font-bold">${r.type}</td><td class="p-5 text-xs">${r.note}</td><td class="p-5"><span class="status-badge ${sClass}">${r.status}</span></td><td class="p-5 text-[10px]">${r.managedBy || '-'}</td><td class="p-5 text-center">${r.status === 'รอดำเนินการ' ? `<button onclick="userCancelReq('${id}')" class="text-red-500">ยกเลิก</button>` : '-'}</td></tr>`;
                    }
                });
            });
        }

        onValue(ref(db, '/'), (snap) => {
            const data = snap.val() || {};
            rawRequests = data.requisitions || {};
            rawUsers = data.users || {};
            renderAdminTables();
            if(data.settings) {
                const s = data.settings;
                if(s.systemName) document.getElementById('sysTitle').innerText = s.systemName;
                if(s.logoUrl && s.logoUrl.trim() !== "") {
                    document.getElementById('defaultLogo').classList.add('hidden');
                    document.getElementById('customLogo').src = s.logoUrl;
                    document.getElementById('customLogo').classList.remove('hidden');
                }
            }
        });

        const renderAdminTables = () => {
            const adReq = document.getElementById('adminReqBody');
            const adUser = document.getElementById('adminUserBody');
            adReq.innerHTML = ''; adUser.innerHTML = '';
            
            // กรองรายการตาม Tab ที่เลือก
            Object.keys(rawRequests).reverse().forEach(id => {
                const r = rawRequests[id];
                
                // ตรวจสอบเงื่อนไขการกรองสถานะ
                let isMatch = false;
                if(currentAdminTab === 'ยกเลิก') {
                    isMatch = (r.status === 'ยกเลิก' || r.status === 'ยกเลิกเอง');
                } else {
                    isMatch = (r.status === currentAdminTab);
                }

                if(isMatch) {
                    adReq.innerHTML += `<tr><td class="p-4 text-[10px]">${r.timestamp}</td><td class="p-4">${r.empID || '-'}</td><td class="p-4 font-bold">${r.user}</td><td class="p-4 text-[10px]">${r.dept}</td><td class="p-4"><button onclick="viewFile('${id}')" class="text-indigo-600 underline font-bold">${r.type}</button></td><td class="p-4 text-xs">${r.note}</td><td class="p-4 text-[10px]">${r.managedBy || '-'}</td><td class="p-4 text-center"><select onchange="updateStatus('${id}', this.value)" class="text-xs border rounded p-1"><option value="รอดำเนินการ" ${r.status==='รอดำเนินการ'?'selected':''}>รอดำเนินการ</option><option value="สำเร็จ" ${r.status==='สำเร็จ'?'selected':''}>สำเร็จ</option><option value="ยกเลิก" ${r.status==='ยกเลิก'?'selected':''}>ยกเลิก</option></select></td></tr>`;
                }
            });

            Object.keys(rawUsers).forEach(uk => {
                const u = rawUsers[uk];
                adUser.innerHTML += `<tr><td class="p-4">${u.empID}</td><td class="p-4 font-bold">${u.name}</td><td class="p-4">${u.dept}</td><td class="p-4">${u.tel || '-'}</td><td class="p-4">${u.user}</td><td class="p-4"><input type="text" value="${u.pass}" onchange="editUser('${uk}', 'pass', this.value)" class="border px-2 py-1 rounded w-20"></td><td class="p-4 text-center"><button onclick="deleteUser('${uk}')" class="text-red-500"><i class="fas fa-trash-alt"></i></button></td></tr>`;
            });
        };

        window.updateStatus = (id, val) => {
            const adminFullName = document.getElementById('adminNameDisp').innerText;
            update(ref(db, 'requisitions/' + id), { 
                status: val, 
                managedBy: adminFullName 
            });
        };

        window.viewFile = (id) => { const d = rawRequests[id]; if(d && d.fileData) { const nw = window.open(); nw.document.write(`<iframe src="${d.fileData}" frameborder="0" style="width:100%; height:100vh;"></iframe>`); } };
        window.editUser = (id, f, v) => update(ref(db, 'users/' + id), { [f]: v });
        window.deleteUser = (id) => { if(confirm('ลบสมาชิก?')) remove(ref(db, 'users/' + id)); };
        window.clearAllHistory = () => { if(confirm('ล้างประวัติทั้งหมด?')) remove(ref(db, 'requisitions')); };
        window.userCancelReq = (id) => { if(confirm('ยกเลิกใบเบิก?')) update(ref(db, 'requisitions/' + id), { status: "ยกเลิกเอง", managedBy: "USER" }); };
        window.logout = () => location.reload();
        window.saveSettings = () => update(ref(db, 'settings'), { systemName: document.getElementById('setSystemName').value, logoUrl: document.getElementById('setLogoUrl').value }).then(() => alert("บันทึกสำเร็จ"));
        
        document.getElementById('regForm').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('regUser').value;
            set(ref(db, 'users/' + u), {
                empID: document.getElementById('regEmpID').value, name: document.getElementById('regName').value,
                dept: document.getElementById('regDept').value, tel: document.getElementById('regTel').value,
                user: u, pass: document.getElementById('regPass').value
            }).then(() => { alert("สมัครสำเร็จ!"); showPage('loginPage'); });
        };
        
        window.openUserPwModal = () => document.getElementById('pwModal').style.display = 'flex';
        window.closeUserPwModal = () => document.getElementById('pwModal').style.display = 'none';
        window.updateUserPassword = () => {
            const p1 = document.getElementById('newPw1').value;
            const p2 = document.getElementById('newPw2').value;
            if(p1 && p1 === p2) {
                update(ref(db, 'users/' + currentUser.user), { pass: p1 }).then(() => { alert("สำเร็จ!"); closeUserPwModal(); });
            } else alert("ไม่ตรงกัน");
        };
    </script>
</body>
</html>
