<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS GC18 - ระบบใบเบิกออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .page { display: none; }
        .page.active { display: block; }
        .status-badge { padding: 4px 12px; border-radius: 99px; font-weight: bold; font-size: 10px; display: inline-block; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-cancel { background: #fee2e2; color: #991b1b; }
        #pwModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100; }
    </style>
</head>
<body>

    <!-- [1] หน้า Login -->
    <div id="loginPage" class="page active">
        <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-10 text-center border-t-8 border-indigo-600">
                <div class="mb-8">
                    <i class="fas fa-warehouse text-5xl text-indigo-700 mb-4"></i>
                    <h2 class="text-2xl font-black text-slate-800 uppercase">Warehouse GC18</h2>
                </div>
                <form id="loginForm" class="space-y-4">
                    <input type="text" id="logUser" placeholder="Username" required class="w-full px-4 py-3 border rounded-2xl outline-none focus:ring-2 ring-indigo-500 bg-slate-50">
                    <input type="password" id="logPass" placeholder="Password" required class="w-full px-4 py-3 border rounded-2xl outline-none focus:ring-2 ring-indigo-500 bg-slate-50">
                    <button type="submit" class="w-full bg-indigo-700 text-white font-bold py-4 rounded-2xl hover:bg-slate-800 transition">เข้าสู่ระบบ</button>
                    <p class="mt-6 text-sm text-gray-500">ยังไม่มีบัญชี? <a href="javascript:showPage('regPage')" class="text-indigo-600 font-bold underline">สมัครสมาชิก</a></p>
                </form>
            </div>
        </div>
    </div>

    <!-- [2] หน้าพนักงาน -->
    <div id="userPage" class="page">
        <nav class="bg-slate-900 text-white p-4 flex justify-between px-8">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg"><i class="fas fa-user text-white"></i></div>
                <div><div class="font-bold" id="userDisp"></div><div class="text-[10px] text-slate-400" id="deptDisp"></div></div>
            </div>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-1 rounded-full text-xs font-bold">Logout</button>
        </nav>
        <div class="container mx-auto p-6 max-w-5xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border-b-4 border-indigo-600">
                    <h3 class="font-black text-lg mb-4">Spare Part</h3>
                    <input type="file" id="spareFile" class="text-xs mb-3 block w-full border-2 border-dashed p-3 rounded-xl">
                    <input type="text" id="spareNote" placeholder="รายละเอียดเพิ่มเติม" class="w-full border p-2 mb-4 rounded-xl text-sm">
                    <button onclick="handleUpload('Spare Part', 'spareFile', 'spareNote')" class="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold">ส่งใบเบิกอะไหล่</button>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-xl border-b-4 border-orange-500">
                    <h3 class="font-black text-lg mb-4">PPE</h3>
                    <input type="file" id="ppeFile" class="text-xs mb-3 block w-full border-2 border-dashed p-3 rounded-xl">
                    <input type="text" id="ppeNote" placeholder="รายละเอียดเพิ่มเติม" class="w-full border p-2 mb-4 rounded-xl text-sm">
                    <button onclick="handleUpload('PPE', 'ppeFile', 'ppeNote')" class="w-full bg-orange-500 text-white py-3 rounded-2xl font-bold">ส่งใบเบิก PPE</button>
                </div>
            </div>
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
                <div class="bg-indigo-600 p-4 text-white font-bold">ประวัติการเบิกของคุณ</div>
                <div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50 border-b"><tr><th class="p-4">วัน/เวลา</th><th class="p-4">ประเภท</th><th class="p-4">สถานะ</th><th class="p-4 text-center">จัดการ</th></tr></thead><tbody id="userHistoryBody"></tbody></table></div>
            </div>
        </div>
    </div>

    <!-- [3] หน้า Admin -->
    <div id="adminPage" class="page">
        <nav class="bg-slate-900 text-white p-4 flex justify-between px-8 border-b-4 border-indigo-600">
            <div class="font-black italic" id="adminRoleTitle">ADMIN CONTROL</div>
            <button onclick="logout()" class="text-xs bg-red-600 px-5 py-2 rounded-full font-bold">Logout</button>
        </nav>
        <div class="p-6 space-y-6">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border">
                <div class="p-4 bg-emerald-600 font-bold text-white uppercase text-xs">ข้อมูลสมาชิก</div>
                <div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="bg-slate-50 border-b"><tr><th class="p-4">รหัสพนักงาน</th><th class="p-4">ชื่อ</th><th class="p-4">หน่วยงาน</th><th class="p-4">USER</th><th class="p-4">PASS</th><th class="p-4 text-center">ลบ</th></tr></thead><tbody id="adminUserBody"></tbody></table></div>
            </div>
            <div class="bg-white rounded-3xl shadow-2xl overflow-hidden border">
                <div class="p-5 bg-indigo-600 font-bold text-white uppercase text-xs">รายการใบเบิกทั้งหมด</div>
                <div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="bg-slate-50 border-b"><tr><th class="p-5">วัน/เวลา</th><th class="p-4">ชื่อ</th><th class="p-4">ประเภท</th><th class="p-4">ผู้จัดการ</th><th class="p-4 text-center">จัดการสถานะ</th></tr></thead><tbody id="adminReqBody"></tbody></table></div>
            </div>
        </div>
    </div>

    <!-- [4] หน้าสมัครสมาชิก -->
    <div id="regPage" class="page">
        <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="max-w-lg w-full bg-white rounded-[2rem] p-10 shadow-2xl">
                <h2 class="text-2xl font-black mb-6">สมัครสมาชิก</h2>
                <form id="regForm" class="space-y-4">
                    <input type="text" id="regEmpID" placeholder="รหัสพนักงาน" required class="w-full border-2 p-3 rounded-xl outline-none">
                    <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" required class="w-full border-2 p-3 rounded-xl outline-none">
                    <input type="text" id="regDept" placeholder="หน่วยงาน" required class="w-full border-2 p-3 rounded-xl outline-none">
                    <input type="text" id="regUser" placeholder="Username" required class="w-full border-2 p-3 rounded-xl outline-none">
                    <input type="password" id="regPass" placeholder="Password" required class="w-full border-2 p-3 rounded-xl outline-none">
                    <div class="flex gap-3 mt-6">
                        <button type="button" onclick="showPage('loginPage')" class="flex-1 bg-slate-100 py-4 rounded-xl font-bold">กลับ</button>
                        <button type="submit" class="flex-[2] bg-indigo-600 text-white py-4 rounded-xl font-bold">สมัครสมาชิก</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB5J0CGXQYb2b1IyfICNWnf5eQfNXNeGcw",
            authDomain: "teeorder-11d9d.firebaseapp.com",
            databaseURL: "https://teeorder-11d9d-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "teeorder-11d9d",
            storageBucket: "teeorder-11d9d.firebasedatabase.app",
            messagingSenderId: "108104956407",
            appId: "1:108104956407:web:767d5c2ecb8069e24516f2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let currentUser = null;
        let adminName = "";
        let rawRequests = {};
        let rawUsers = {};

        // รายชื่อ Admin/Staff
        const ADMIN_LIST = ['admin', '26000946', '26000589', 'z0009675', 'z0011998'];

        window.showPage = (id) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // --- ระบบ Login (เช็คจาก Database เป็นหลัก) ---
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('logUser').value;
            const p = document.getElementById('logPass').value;

            // 1. เช็ค Super Admin (ล็อกรหัส)
            if (u === 'admin' && p === '1234') {
                adminName = "SYSTEM ADMIN";
                document.getElementById('adminRoleTitle').innerText = "ADMIN CONTROL";
                return showPage('adminPage');
            }

            // 2. เช็คจากฐานข้อมูล
            const userInDB = rawUsers[u];
            if (userInDB && userInDB.pass === p) {
                if (ADMIN_LIST.includes(u)) {
                    adminName = userInDB.name;
                    document.getElementById('adminRoleTitle').innerText = "STAFF CONTROL (" + adminName + ")";
                    showPage('adminPage');
                } else {
                    currentUser = userInDB;
                    document.getElementById('userDisp').innerText = userInDB.name;
                    document.getElementById('deptDisp').innerText = userInDB.dept;
                    showPage('userPage');
                    startHistoryListener();
                }
            } else {
                alert("User หรือ Password ผิด!");
            }
        };

        // --- ระบบจัดการข้อมูล ---
        window.handleUpload = (type, fileId, noteId) => {
            const file = document.getElementById(fileId).files[0];
            if(!file) return alert("เลือกไฟล์ก่อน");
            const reader = new FileReader();
            reader.onload = (e) => {
                push(ref(db, 'requisitions'), {
                    user: currentUser.name, empID: currentUser.empID, dept: currentUser.dept,
                    type, note: document.getElementById(noteId).value || "-",
                    fileData: e.target.result, status: "รอดำเนินการ",
                    timestamp: new Date().toLocaleString('th-TH'), managedBy: ""
                });
                alert("ส่งสำเร็จ!");
                document.getElementById(fileId).value = ''; document.getElementById(noteId).value = '';
            };
            reader.readAsDataURL(file);
        };

        function startHistoryListener() {
            onValue(ref(db, 'requisitions'), (snap) => {
                const data = snap.val() || {};
                const uHist = document.getElementById('userHistoryBody');
                uHist.innerHTML = '';
                Object.keys(data).reverse().forEach(id => {
                    const r = data[id];
                    if(currentUser && r.empID === currentUser.empID) {
                        let sClass = r.status === 'สำเร็จ' ? 'status-success' : (r.status === 'ยกเลิก' ? 'status-cancel' : 'status-pending');
                        uHist.innerHTML += `<tr><td class="p-4">${r.timestamp}</td><td class="p-4 font-bold">${r.type}</td><td class="p-4"><span class="status-badge ${sClass}">${r.status}</span></td><td class="p-4 text-center">${r.status === 'รอดำเนินการ' ? `<button onclick="deleteReq('${id}')" class="text-red-500">ยกเลิก</button>` : '-'}</td></tr>`;
                    }
                });
            });
        }

        const renderAdminTables = () => {
            const adReq = document.getElementById('adminReqBody');
            const adUser = document.getElementById('adminUserBody');
            adReq.innerHTML = ''; adUser.innerHTML = '';
            
            Object.keys(rawRequests).reverse().forEach(id => {
                const r = rawRequests[id];
                adReq.innerHTML += `<tr><td class="p-4">${r.timestamp}</td><td class="p-4">${r.user}</td><td class="p-4"><button onclick="viewFile('${id}')" class="text-indigo-600 underline">${r.type}</button></td><td class="p-4">${r.managedBy || '-'}</td><td class="p-4 text-center"><select onchange="updateStatus('${id}', this.value)" class="text-xs border rounded p-1"><option value="รอดำเนินการ" ${r.status==='รอดำเนินการ'?'selected':''}>รอดำเนินการ</option><option value="สำเร็จ" ${r.status==='สำเร็จ'?'selected':''}>สำเร็จ</option><option value="ยกเลิก" ${r.status==='ยกเลิก'?'selected':''}>ยกเลิก</option></select></td></tr>`;
            });

            Object.keys(rawUsers).forEach(uk => {
                const u = rawUsers[uk];
                adUser.innerHTML += `<tr><td class="p-4">${u.empID}</td><td class="p-4 font-bold">${u.name}</td><td class="p-4">${u.dept}</td><td class="p-4">${u.user}</td><td class="p-4"><input type="text" value="${u.pass}" onchange="editUser('${uk}', 'pass', this.value)" class="border px-2 py-1 rounded w-24"></td><td class="p-4 text-center"><button onclick="deleteUser('${uk}')" class="text-red-500"><i class="fas fa-trash-alt"></i></button></td></tr>`;
            });
        };

        onValue(ref(db, '/'), (snap) => {
            const data = snap.val() || {};
            rawRequests = data.requisitions || {};
            rawUsers = data.users || {};
            renderAdminTables();
        });

        window.viewFile = (id) => { const d = rawRequests[id]; if(d && d.fileData) { const nw = window.open(); nw.document.write(`<iframe src="${d.fileData}" frameborder="0" style="width:100%; height:100vh;"></iframe>`); } };
        window.updateStatus = (id, val) => update(ref(db, 'requisitions/' + id), { status: val, managedBy: adminName });
        window.editUser = (id, f, v) => update(ref(db, 'users/' + id), { [f]: v });
        window.deleteUser = (id) => { if(confirm('ลบสมาชิก?')) remove(ref(db, 'users/' + id)); };
        window.deleteReq = (id) => { if(confirm('ยกเลิกใบเบิก?')) remove(ref(db, 'requisitions/' + id)); };
        window.logout = () => { location.reload(); };

        document.getElementById('regForm').onsubmit = (e) => {
            e.preventDefault();
            const u = document.getElementById('regUser').value;
            set(ref(db, 'users/' + u), {
                empID: document.getElementById('regEmpID').value,
                name: document.getElementById('regName').value,
                dept: document.getElementById('regDept').value,
                user: u, pass: document.getElementById('regPass').value
            }).then(() => { alert("สำเร็จ!"); showPage('loginPage'); });
        };
    </script>
</body>
</html>
